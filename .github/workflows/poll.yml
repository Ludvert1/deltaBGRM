name: Poll live feed

# Why this exists
# ---------------
# Vercel's Hobby plan allows only two cron jobs, at a maximum of once per day —
# nowhere near enough to learn a schedule or build a usable timeline. This
# workflow pings the deployment's poller on a real interval instead.
#
# Setup: repository → Settings → Secrets and variables → Actions
#   PLATFORM_URL   https://your-project.vercel.app     (required)
#   CRON_SECRET    same value as the Vercel env var    (only if you set one)
#
# Cost note: on a private repository these runs consume GitHub Actions minutes.
# Every-15-minutes is about 2,880 minutes a month, which exceeds the free
# allowance for private repos. Either make the repo public (Actions is free
# there), widen the interval, or use a free external pinger such as
# cron-job.org pointed at {PLATFORM_URL}/api/cron/poll.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the poller
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PLATFORM_URL" ]; then
            echo "::error::PLATFORM_URL secret is not set."
            exit 1
          fi
          auth=()
          [ -n "$CRON_SECRET" ] && auth=(-H "Authorization: Bearer $CRON_SECRET")
          code=$(curl -sS -o /tmp/poll.json -w "%{http_code}" --max-time 90 \
                 "${auth[@]}" "${PLATFORM_URL%/}/api/cron/poll")
          echo "HTTP $code"
          cat /tmp/poll.json
          echo
          [ "$code" = "200" ] || exit 1
